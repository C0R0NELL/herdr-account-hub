id = "c0r0nell.account-hub"
name = "Account Hub"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Manage independent account profiles. Switch the Codex account for this machine and reload existing chats while preserving history and titles."
platforms = ["macos", "linux"]

# The picker manages profiles and confirms machine-wide Codex account changes.
[[actions]]
id = "open"
title = "Account Hub: open picker"
contexts = ["global"]
command = ["python3", "switcher.py", "open"]

# Cycle to the next profile of the focused agent's kind — the "on the go" path,
# no UI. `pane` context so it can read the focused agent to pick the kind.
[[actions]]
id = "next"
title = "Account Hub: switch to next account"
contexts = ["global", "pane"]
command = ["python3", "switcher.py", "next"]

# Snapshot whatever is logged in right now into a new profile.
[[actions]]
id = "save"
title = "Account Hub: save current login as a profile"
contexts = ["global"]
command = ["python3", "switcher.py", "save"]

[[panes]]
id = "picker"
title = "Account Hub"
command = ["python3", "switcher.py", "ui"]
placement = "overlay"
