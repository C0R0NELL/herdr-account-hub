id = "c0r0nell.account-hub"
name = "Account Hub"
version = "0.3.1"
min_herdr_version = "0.8.0"
description = "Codex and Claude Code account picker with usage tracking and Codex resets. Codex reloads existing chats while preserving history; Claude is beta."
platforms = ["macos", "linux"]

# Prepare durable storage before Herdr replaces an older managed checkout.
# Standard-library migration only: no compilation, login, or provider requests.
[[build]]
command = ["python3", "switcher.py", "storage-migrate"]

# The picker manages profiles and confirms machine-wide Codex account changes.
[[actions]]
id = "open"
title = "Account Hub: open picker"
contexts = ["global"]
command = ["python3", "switcher.py", "open"]

# Cycle to the next profile of the focused agent's kind — the "on the go" path,
# no UI. `pane` context so it can read the focused agent to pick the kind.
[[actions]]
id = "next"
title = "Account Hub: switch to next account"
contexts = ["global", "pane"]
command = ["python3", "switcher.py", "next"]

# Save the current login when its email is not already registered.
[[actions]]
id = "save"
title = "Account Hub: save current login as a profile"
contexts = ["global"]
command = ["python3", "switcher.py", "save"]

[[panes]]
id = "picker"
title = "Account Hub"
command = ["python3", "switcher.py", "ui"]
placement = "overlay"
